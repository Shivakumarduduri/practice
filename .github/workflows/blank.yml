package pages;

import org.openqa.selenium.By;
import org.openqa.selenium.JavascriptExecutor;
import org.openqa.selenium.WebDriver;
import org.openqa.selenium.WebElement;
import org.openqa.selenium.support.ui.ExpectedConditions;
import org.openqa.selenium.support.ui.WebDriverWait;

import java.time.Duration;
import java.util.List;
import java.util.stream.Collectors;

public class ProductsPage {
    WebDriver driver;
    WebDriverWait wait;

    private By searchInput = By.id("search_product");
    private By searchBtn = By.id("submit_search");
    private By productNames = By.cssSelector(".productinfo p");
    private By addToCartBtns = By.cssSelector(".productinfo .add-to-cart");
    private By continueShoppingBtn = By.cssSelector(".btn-success");
    private By viewCartModalLink = By.cssSelector("u");

    public ProductsPage(WebDriver driver) {
        this.driver = driver;
        this.wait = new WebDriverWait(driver, Duration.ofSeconds(10));
    }

    public void searchProduct(String name) {
        WebElement input = wait.until(ExpectedConditions.visibilityOfElementLocated(searchInput));
        input.clear();
        input.sendKeys(name);
        
        // Use JS click on search button to prevent interception
        WebElement sBtn = driver.findElement(searchBtn);
        ((JavascriptExecutor) driver).executeScript("arguments[0].click();", sBtn);
    }

    public List<String> getSearchedProductNames() {
        List<WebElement> elements = wait.until(ExpectedConditions.presenceOfAllElementsLocatedBy(productNames));
        return elements.stream().map(WebElement::getText).collect(Collectors.toList());
    }

    public void addProductToCartByIndex(int index) {
        List<WebElement> buttons = wait.until(ExpectedConditions.presenceOfAllElementsLocatedBy(addToCartBtns));
        // Scroll into view and click using JavaScript
        ((JavascriptExecutor) driver).executeScript("arguments[0].scrollIntoView(true);", buttons.get(index));
        ((JavascriptExecutor) driver).executeScript("arguments[0].click();", buttons.get(index));
    }

    public void clickContinueShopping() {
        WebElement btn = wait.until(ExpectedConditions.presenceOfElementLocated(continueShoppingBtn));
        ((JavascriptExecutor) driver).executeScript("arguments[0].click();", btn);
    }

    public void openCartFromModal() {
        WebElement link = wait.until(ExpectedConditions.presenceOfElementLocated(viewCartModalLink));
        ((JavascriptExecutor) driver).executeScript("arguments[0].click();", link);
    }
}
