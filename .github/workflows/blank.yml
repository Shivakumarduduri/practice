package tests;

import base.BaseTest;
import org.testng.Assert;
import org.testng.annotations.DataProvider;
import org.testng.annotations.Test;
import pages.*;

import java.util.List;

public class ShoppingWorkflowTest extends BaseTest {

    @Test
    public void testFullShoppingWorkflow() throws InterruptedException {
        HomePage home = new HomePage(driver);
        SignupLoginPage signup = new SignupLoginPage(driver);
        ProductsPage products = new ProductsPage(driver);
        CartPage cart = new CartPage(driver);
        CheckoutPage checkout = new CheckoutPage(driver);

        // 16. Open website & verify home page load
        home.open();
        Assert.assertTrue(home.isHomePageLoaded(), "Home page failed to load!");

        // 17 & 18. Register and authenticate
        home.goToSignupLogin();
        String email = "test_" + System.currentTimeMillis() + "@test.com";
        signup.initiateSignup("Duduri", email);
        signup.fillAccountDetails("Pass123", "Duduri", "Shivakumar", "123 St", "Telangana", "Hyderabad", "500001", "9876543210");
        signup.clickContinue();

        // 19 & 20. Open Products and search for an item
        driver.get("https://automationexercise.com/products");
        products.searchProduct("Top");
        List<String> searchResults = products.getSearchedProductNames();
        Assert.assertFalse(searchResults.isEmpty(), "No items found!");

        // 21. Add two different products to cart
        products.addProductToCartByIndex(0);
        products.clickContinueShopping();
        products.addProductToCartByIndex(1);
        products.clickContinueShopping();

        // 22. Add third product
        products.searchProduct("Shirt");
        products.addProductToCartByIndex(0);
        products.openCartFromModal();

        // 23. Verify all 3 products in cart
        List<String> items = cart.getCartProductNames();
        Assert.assertEquals(items.size(), 3, "Cart item count incorrect!");

        // 24. Remove one product and verify update
        cart.removeProductByIndex(0);
        Thread.sleep(1500);
        Assert.assertEquals(cart.getCartProductNames().size(), 2, "Failed to remove item from cart!");

        // 25 & 26. Complete order & verify confirmation
        cart.proceedToCheckout();
        checkout.clickPlaceOrder();
        checkout.enterPaymentDetails("Duduri", "4111222233334444", "123", "12", "2028");
        Assert.assertTrue(checkout.getSuccessText().contains("Congratulations"), "Order failed!");

        // 27. Log out and verify logged-out state
        home.logout();
        home.goToSignupLogin();
        Assert.assertTrue(driver.getPageSource().contains("Login to your account"), "Logout verification failed!");
    }

    // --- Additional Challenge: Data-Driven Search Test ---
    @DataProvider(name = "searchKeywords")
    public Object[][] getKeywords() {
        return new Object[][]{ {"Top"}, {"Jeans"}, {"Shirt"} };
    }

    @Test(dataProvider = "searchKeywords")
    public void testDataDrivenSearch(String keyword) {
        HomePage home = new HomePage(driver);
        ProductsPage products = new ProductsPage(driver);

        home.open();
        driver.get("https://automationexercise.com/products");
        products.searchProduct(keyword);
        Assert.assertFalse(products.getSearchedProductNames().isEmpty(), "No results for " + keyword);
    }
}












