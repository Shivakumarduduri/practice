package tests;

import base.BaseTest;
import org.testng.Assert;
import org.testng.annotations.Test;
import pages.HomePage;
import pages.SignupLoginPage;

public class RegistrationTest extends BaseTest {

    @Test
    public void verifyUserRegistrationAndLogin() {
        HomePage homePage = new HomePage(driver);
        SignupLoginPage signupLoginPage = new SignupLoginPage(driver);

        // 16. Open the website and verify that the home page loads[cite: 1]
        homePage.open();
        Assert.assertTrue(homePage.isHomePageLoaded(), "Home page did not load!");

        // 17. Navigate to Signup/Login and create a unique test account[cite: 1]
        homePage.goToSignupLogin();
        String uniqueEmail = "user_" + System.currentTimeMillis() + "@test.com";
        signupLoginPage.initiateSignup("Duduri", uniqueEmail);

        signupLoginPage.fillAccountDetails(
            "Password123", "Duduri", "Shivakumar",
            "123 Street", "Telangana", "Hyderabad",
            "500001", "9876543210"
        );

        // 18. Verify successful registration and authenticated navigation[cite: 1]
        Assert.assertTrue(signupLoginPage.isAccountCreated(), "Account creation failed!");
        signupLoginPage.clickContinue();

        Assert.assertEquals(homePage.getLoggedInUsername(), "Duduri", "Logged-in username mismatch!");
    }
}
