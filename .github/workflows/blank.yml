package pages;

import org.openqa.selenium.By;
import org.openqa.selenium.WebDriver;
import org.openqa.selenium.WebElement;
import org.openqa.selenium.support.ui.ExpectedConditions;
import org.openqa.selenium.support.ui.WebDriverWait;

import java.time.Duration;
import java.util.List;
import java.util.stream.Collectors;

public class CartPage {
    WebDriver driver;
    WebDriverWait wait;

    private By productDescriptions = By.cssSelector(".cart_description h4");
    private By deleteBtns = By.cssSelector(".cart_quantity_delete");
    private By proceedToCheckoutBtn = By.cssSelector(".check_out");

    public CartPage(WebDriver driver) {
        this.driver = driver;
        this.wait = new WebDriverWait(driver, Duration.ofSeconds(10));
    }

    public List<String> getCartProductNames() {
        List<WebElement> elements = wait.until(ExpectedConditions.presenceOfAllElementsLocatedBy(productDescriptions));
        return elements.stream().map(WebElement::getText).collect(Collectors.toList());
    }

    public void removeProductByIndex(int index) {
        List<WebElement> buttons = driver.findElements(deleteBtns);
        buttons.get(index).click();
    }

    public void proceedToCheckout() {
        wait.until(ExpectedConditions.elementToBeClickable(proceedToCheckoutBtn)).click();
    }
}


