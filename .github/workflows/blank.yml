package pages;

import org.openqa.selenium.By;
import org.openqa.selenium.WebDriver;
import org.openqa.selenium.support.ui.ExpectedConditions;
import org.openqa.selenium.support.ui.WebDriverWait;
import java.time.Duration;

public class SignupLoginPage {
    WebDriver driver;
    WebDriverWait wait;

    private By nameField = By.cssSelector("input[data-qa='signup-name']");
    private By emailField = By.cssSelector("input[data-qa='signup-email']");
    private By signupBtn = By.cssSelector("button[data-qa='signup-button']");

    private By titleMr = By.id("id_gender1");
    private By passwordField = By.id("password");
    private By firstName = By.id("first_name");
    private By lastName = By.id("last_name");
    private By address = By.id("address1");
    private By state = By.id("state");
    private By city = By.id("city");
    private By zipcode = By.id("zipcode");
    private By mobileNumber = By.id("mobile_number");
    private By createAccountBtn = By.cssSelector("button[data-qa='create-account']");
    private By accountCreatedMsg = By.cssSelector("h2[data-qa='account-created']");
    private By continueBtn = By.cssSelector("a[data-qa='continue-button']");

    public SignupLoginPage(WebDriver driver) {
        this.driver = driver;
        this.wait = new WebDriverWait(driver, Duration.ofSeconds(10));
    }

    public void initiateSignup(String name, String email) {
        wait.until(ExpectedConditions.visibilityOfElementLocated(nameField)).sendKeys(name);
        driver.findElement(emailField).sendKeys(email);
        driver.findElement(signupBtn).click();
    }

    public void fillAccountDetails(String pwd, String fName, String lName, String addr, String st, String cit, String zip, String mobile) {
        wait.until(ExpectedConditions.elementToBeClickable(titleMr)).click();
        driver.findElement(passwordField).sendKeys(pwd);
        driver.findElement(firstName).sendKeys(fName);
        driver.findElement(lastName).sendKeys(lName);
        driver.findElement(address).sendKeys(addr);
        driver.findElement(state).sendKeys(st);
        driver.findElement(city).sendKeys(cit);
        driver.findElement(zipcode).sendKeys(zip);
        driver.findElement(mobileNumber).sendKeys(mobile);
        driver.findElement(createAccountBtn).click();
    }

    public boolean isAccountCreated() {
        return wait.until(ExpectedConditions.visibilityOfElementLocated(accountCreatedMsg)).getText().equalsIgnoreCase("ACCOUNT CREATED!");
    }

    public void clickContinue() {
        wait.until(ExpectedConditions.elementToBeClickable(continueBtn)).click();
    }
}
